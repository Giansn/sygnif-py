<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYGNIF nexus</title>
<style>
  :root{
    --bg:#06080b; --bg2:#0a0e13; --panel:rgba(255,255,255,.025);
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
    --ink:#e8edf2; --mut:#7c8794; --dim:#525c66;
    --cy:#22D3EE; --cy-dim:rgba(34,211,238,.14); --cy-line:rgba(34,211,238,.35);
    --grn:#34d399; --amb:#fbbf24; --red:#f87171;
    --r:14px; --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 700px at 78% -10%,rgba(34,211,238,.08),transparent 55%),
               radial-gradient(900px 600px at 10% 110%,rgba(34,211,238,.05),transparent 55%),
               var(--bg);
    color:var(--ink); font-family:var(--sans);
    min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .wrap{width:100%; max-width:1180px; margin:0 auto; padding:clamp(20px,4vw,52px) clamp(18px,4vw,40px); flex:1; display:flex; flex-direction:column}

  /* header */
  header{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:34px}
  .brand{display:flex; align-items:center; gap:16px}
  .sigil{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--cy-dim),transparent);border:1px solid var(--cy-line);
    color:var(--cy);font-size:24px;font-weight:700;box-shadow:0 0 30px rgba(34,211,238,.16) inset}
  h1{font-size:21px;font-weight:600;letter-spacing:.04em}
  h1 b{color:var(--cy);font-weight:600}
  .sub{font-family:var(--mono);font-size:12px;color:var(--mut);margin-top:4px;letter-spacing:.02em}
  .sub .dot{color:var(--grn)}
  .meta{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-align:right;line-height:1.7}
  .meta b{color:var(--mut);font-weight:500}

  /* section label */
  .seclabel{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--dim);display:flex;align-items:center;gap:12px;margin:0 2px 16px}
  .seclabel::after{content:"";flex:1;height:1px;background:var(--line)}
  .seclabel .n{color:var(--cy);background:var(--cy-dim);border:1px solid var(--cy-line);
    border-radius:20px;padding:1px 9px;font-size:10.5px;letter-spacing:.1em}

  /* portal grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:18px 18px 14px;transition:.18s ease;overflow:hidden;cursor:default}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--cy));opacity:.85}
  .card:hover{border-color:var(--line2);background:rgba(255,255,255,.04);transform:translateY(-2px)}
  .card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .type{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent,var(--cy));font-weight:600}
  .state{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--mut)}
  .state .pip{width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn)}
  .state.attached .pip{background:var(--amb);box-shadow:0 0 8px var(--amb)}
  .label{font-size:22px;font-weight:600;letter-spacing:-.01em;word-break:break-word;line-height:1.15}
  .name{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:3px}
  .row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;
    padding-top:12px;border-top:1px solid var(--line)}
  .size{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .acts{display:flex;gap:6px;opacity:0;transition:.18s}
  .card:hover .acts{opacity:1}
  .ico{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:transparent;
    color:var(--mut);cursor:pointer;font-size:13px;display:grid;place-items:center;transition:.14s;font-family:var(--mono)}
  .ico:hover{border-color:var(--cy-line);color:var(--cy);background:var(--cy-dim)}
  .ico.danger:hover{border-color:rgba(248,113,113,.4);color:var(--red);background:rgba(248,113,113,.1)}
  .attach{flex:1;text-align:left;background:transparent;border:none;color:var(--mut);cursor:pointer;
    font-family:var(--mono);font-size:11px;padding:0;letter-spacing:.02em;transition:.14s}
  .attach:hover{color:var(--cy)}
  .attach b{color:var(--ink);font-weight:500}

  /* new-portal card */
  .newcard{border:1px dashed var(--line2);background:transparent;display:flex;flex-direction:column;
    justify-content:center;gap:14px;min-height:152px;cursor:default}
  .newcard .seg{display:flex;gap:7px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:12px;padding:6px 13px;border-radius:9px;border:1px solid var(--line);
    background:transparent;color:var(--mut);cursor:pointer;transition:.14s;letter-spacing:.04em}
  .chip:hover{border-color:var(--line2);color:var(--ink)}
  .chip.sel{border-color:var(--cy-line);color:var(--cy);background:var(--cy-dim)}
  .newrow{display:flex;gap:8px}
  .newrow input{flex:1;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:9px;
    padding:9px 12px;color:var(--ink);font-family:var(--mono);font-size:13px;outline:none;transition:.14s}
  .newrow input:focus{border-color:var(--cy-line);box-shadow:0 0 0 3px var(--cy-dim)}
  .newrow input::placeholder{color:var(--dim)}
  .go{background:var(--cy);color:#03252b;border:none;border-radius:9px;padding:0 16px;font-weight:600;
    font-family:var(--mono);font-size:13px;cursor:pointer;transition:.14s;letter-spacing:.02em}
  .go:hover{box-shadow:0 0 22px rgba(34,211,238,.4)}
  .go:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .nclabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

  /* footer / tunnel hint */
  footer{margin-top:auto;padding-top:30px;font-family:var(--mono);font-size:11.5px;color:var(--dim);
    display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:34px}
  footer code{color:var(--mut);background:rgba(255,255,255,.04);padding:2px 7px;border-radius:6px}
  .empty{font-family:var(--mono);font-size:13px;color:var(--dim);padding:30px 4px}

  /* toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--bg2);border:1px solid var(--cy-line);color:var(--ink);font-family:var(--mono);
    font-size:12.5px;padding:11px 18px;border-radius:11px;opacity:0;transition:.25s;pointer-events:none;
    box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:50;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast b{color:var(--cy)}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="sigil">Σ</div>
        <div>
          <h1>SYGNIF <b>nexus</b></h1>
          <div class="sub"><span class="dot">●</span> <span id="host">localhost</span> · portal control</div>
        </div>
      </div>
      <div class="meta">
        <div><b id="count">0</b> live portals</div>
        <div>refreshed <b id="ago">now</b></div>
      </div>
    </header>

    <div class="seclabel">Portals <span class="n" id="ncount">0</span></div>
    <div class="grid" id="grid"></div>

    <footer>
      <span>attach in your terminal · click a card to copy <code>tmux attach -t &lt;name&gt;</code></span>
      <span>remote? tunnel in · <code>ssh -N -L 8910:127.0.0.1:8910 &lt;host&gt;</code></span>
    </footer>
  </div>
  <div id="toast"></div>

<script>
const ACCENT = { sygnif:"#34d399", claude:"#22D3EE", shell:"#fb923c", grok:"#f87171", aider:"#818cf8" };
let TYPES = ["sygnif","claude","shell"];
let sel = "sygnif";
let lastFetch = Date.now();

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(html){ const t=$("#toast"); t.innerHTML=html; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }

async function api(path, method="GET", body){
  const r = await fetch(path, {method, headers:body?{"Content-Type":"application/json"}:{},
    body: body?JSON.stringify(body):undefined});
  return r.json();
}

function copy(txt){
  navigator.clipboard?.writeText(txt).then(
    ()=>toast(`copied · <b>${esc(txt)}</b>`),
    ()=>toast(`run · <b>${esc(txt)}</b>`));
}

function card(p){
  const a = ACCENT[p.type] || "#22D3EE";
  const cmd = `tmux attach -t ${p.name}`;
  return `<div class="card" style="--accent:${a}">
    <div class="top">
      <span class="type">${esc(p.type)}</span>
      <span class="state ${p.state}"><span class="pip"></span>${p.state}</span>
    </div>
    <div class="label">${esc(p.label)}</div>
    <div class="name">${esc(p.name)}</div>
    <div class="row">
      <button class="attach" title="copy attach command" onclick="copy('${esc(cmd)}')">▸ <b>${esc(cmd)}</b></button>
      <div class="acts">
        <button class="ico" title="rename" onclick="rename('${esc(p.name)}','${esc(p.type)}')">✎</button>
        <button class="ico danger" title="kill" onclick="kill('${esc(p.name)}')">✕</button>
      </div>
    </div>
  </div>`;
}

function newCard(){
  const chips = TYPES.map(t=>`<button class="chip ${t===sel?'sel':''}" data-t="${t}"
    style="${t===sel?`--accent:${ACCENT[t]}`:''}" onclick="pick('${t}')">${t}</button>`).join("");
  return `<div class="card newcard" style="--accent:${ACCENT[sel]}">
    <div class="nclabel">new portal</div>
    <div class="seg">${chips}</div>
    <div class="newrow">
      <input id="lbl" placeholder="label  e.g. thesis, recon, trading" autocomplete="off"
        onkeydown="if(event.key==='Enter')spawn()">
      <button class="go" onclick="spawn()">spawn</button>
    </div>
  </div>`;
}

window.pick = t => { sel = t; render(window._portals||[]); $("#lbl")?.focus(); };

window.spawn = async () => {
  const lbl = ($("#lbl")?.value||"").trim();
  if(!lbl){ $("#lbl")?.focus(); toast("give it a label first"); return; }
  toast(`spawning <b>${esc(sel)}-${esc(lbl)}</b>…`);
  const r = await api("/api/portals","POST",{type:sel,label:lbl});
  if(r.ok){ toast(`portal <b>${esc(r.name)}</b> ready · attach: <b>nexus ${esc(r.name)}</b>`); load(); }
  else toast(`error · ${esc(r.error||"failed")}`);
};

window.kill = async (name) => {
  if(!confirm(`Kill portal "${name}"? Anything running in it is lost.`)) return;
  const r = await api("/api/kill","POST",{name});
  toast(r.ok?`killed <b>${esc(name)}</b>`:`error · ${esc(r.error||"failed")}`); load();
};

window.rename = async (name,type) => {
  const lbl = prompt(`New label for ${name}:`, "");
  if(lbl===null || !lbl.trim()) return;
  const r = await api("/api/rename","POST",{name,label:lbl.trim()});
  toast(r.ok?`renamed → <b>${esc(r.name)}</b>`:`error · ${esc(r.error||"failed")}`); load();
};

function render(portals){
  window._portals = portals;
  $("#grid").innerHTML = portals.map(card).join("") + newCard();
  $("#count").textContent = portals.length;
  $("#ncount").textContent = portals.length;
}

async function load(){
  try{
    const d = await api("/api/portals");
    TYPES = d.types||TYPES;
    if(!TYPES.includes(sel)) sel = TYPES[0];
    $("#host").textContent = d.host||"localhost";
    render(d.portals||[]);
    lastFetch = Date.now();
  }catch(e){ $("#grid").innerHTML = `<div class="empty">server unreachable — is sygnif-nexus running?</div>`; }
}

setInterval(()=>{ const s=Math.round((Date.now()-lastFetch)/1000);
  $("#ago").textContent = s<2?"now":s+"s ago"; }, 1000);
setInterval(load, 3000);   // live state
load();
</script>
</body>
</html>
